# news.chenghaha.club — 复用既有 Let's Encrypt 证书，反代到本地看板(127.0.0.1:8765)
# 证书路径沿用 /etc/letsencrypt/live/news.chenghaha.club

server {
    listen 80;
    server_name news.chenghaha.club;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name news.chenghaha.club;

    ssl_certificate     /etc/letsencrypt/live/news.chenghaha.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.chenghaha.club/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 前端 + /api 同源，统一反代到本地看板服务(服务自身已处理 /api/* 路由)
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
